---
resources:
  - name: source
    type: git
    icon: github
    source:
      uri: ((repo))
      branch: ((branch))
      username: ((git.username))
      password: ((git.password))
      paths: ((git_paths))

  # Images are first pushed under a temporary quarantine-<SHA> tag. Harbor
  # creates the immutable git-<SHA> tag only after its scanner passes the image.
  - name: hotfix-image
    type: registry-image
    icon: docker
    source:
      repository: ((harbor.repository))/((hotfix_image))
      username: ((harbor.username))
      password: ((harbor.password))

jobs:
  - name: build-scan-and-publish
    serial: true
    plan:
      - get: source
        trigger: true
        version: every

      - task: build-image
        privileged: true
        config:
          platform: linux
          image_resource:
            type: registry-image
            source:
              repository: concourse/oci-build-task
              tag: ((oci_build_task_tag))
          inputs:
            - name: source
          outputs:
            - name: image
          caches:
            - path: cache
          params:
            CONTEXT: source/((dockerfile_path))
          run:
            path: build

      - task: prepare-quarantine-tag
        config:
          platform: linux
          image_resource:
            type: registry-image
            source:
              repository: ((harbor_api_task_repository))
              tag: ((harbor_api_task_tag))
          inputs:
            - name: source
          outputs:
            - name: image-tags
          run:
            path: /bin/sh
            args:
              - -ec
              - |
                git_ref="$(tr -d '\r\n' < source/.git/ref)"
                if ! printf '%s\n' "${git_ref}" | grep -Eq '^[0-9a-f]{40}$'; then
                  echo "Invalid hotfix Git SHA: ${git_ref}" >&2
                  exit 1
                fi

                printf 'quarantine-%s\n' "${git_ref}" > image-tags/tags

      # additional_tags without a resource-level tag pushes only the tag in the
      # file; registry-image does not add the default latest tag.
      - put: hotfix-image
        params:
          image: image/image.tar
          additional_tags: image-tags/tags
        get_params:
          skip_download: true

      - task: evaluate-harbor-scan
        config:
          platform: linux
          image_resource:
            type: registry-image
            source:
              repository: ((harbor_api_task_repository))
              tag: ((harbor_api_task_tag))
          inputs:
            - name: source
          outputs:
            - name: scan-report
          params:
            HARBOR_API_SCHEME: ((harbor_api_scheme))
            IMAGE_REPOSITORY: ((harbor.repository))/((hotfix_image))
            HARBOR_USERNAME: ((harbor.username))
            HARBOR_PASSWORD: ((harbor.password))
            SCAN_WAIT_ATTEMPTS: ((harbor_scan_wait_attempts))
            SCAN_WAIT_SECONDS: ((harbor_scan_wait_seconds))
            BLOCKED_SEVERITIES: ((harbor_blocked_severities))
          run:
            path: python
            args:
              - -c
              - |
                import base64
                import json
                import os
                import pathlib
                import ssl
                import sys
                import time
                import urllib.error
                import urllib.parse
                import urllib.request

                scheme = os.environ["HARBOR_API_SCHEME"]
                image_repository = os.environ["IMAGE_REPOSITORY"]
                username = os.environ["HARBOR_USERNAME"]
                password = os.environ["HARBOR_PASSWORD"]
                wait_attempts = int(os.environ["SCAN_WAIT_ATTEMPTS"])
                wait_seconds = int(os.environ["SCAN_WAIT_SECONDS"])
                blocked_severities = {
                    value.strip().lower()
                    for value in os.environ["BLOCKED_SEVERITIES"].split(",")
                    if value.strip()
                }

                if scheme not in {"http", "https"}:
                    raise SystemExit("HARBOR_API_SCHEME must be http or https")
                if wait_attempts < 1 or wait_seconds < 0:
                    raise SystemExit("Harbor scan wait settings are invalid")
                if not blocked_severities:
                    raise SystemExit("BLOCKED_SEVERITIES must not be empty")

                git_sha = pathlib.Path("source/.git/ref").read_text().strip()
                if len(git_sha) != 40 or any(c not in "0123456789abcdef" for c in git_sha):
                    raise SystemExit(f"Invalid hotfix Git SHA: {git_sha}")

                registry_host, separator, repository_path = image_repository.partition("/")
                project, separator2, repository = repository_path.partition("/")
                if not separator or not separator2 or not all(
                    (registry_host, project, repository)
                ):
                    raise SystemExit(
                        "IMAGE_REPOSITORY must use host/project/repository format"
                    )

                # Harbor requires repository names containing slashes to be
                # URL encoded twice.
                encoded_project = urllib.parse.quote(project, safe="")
                encoded_repository = urllib.parse.quote(
                    urllib.parse.quote(repository, safe=""), safe=""
                )
                api_base = (
                    f"{scheme}://{registry_host}/api/v2.0/projects/"
                    f"{encoded_project}/repositories/{encoded_repository}"
                )
                quarantine_tag = f"quarantine-{git_sha}"
                candidate_tag = f"git-{git_sha}"
                auth = base64.b64encode(
                    f"{username}:{password}".encode()
                ).decode()
                vulnerability_accept = (
                    "application/vnd.security.vulnerability.report; version=1.1, "
                    "application/vnd.scanner.adapter.vuln.report.harbor+json; "
                    "version=1.0"
                )

                def request(method, path, body=None, accept="application/json"):
                    headers = {
                        "Authorization": f"Basic {auth}",
                        "Accept": accept,
                    }
                    data = None
                    if body is not None:
                        data = json.dumps(body).encode()
                        headers["Content-Type"] = "application/json"
                    req = urllib.request.Request(
                        f"{api_base}{path}",
                        data=data,
                        headers=headers,
                        method=method,
                    )
                    try:
                        with urllib.request.urlopen(
                            req, timeout=60, context=ssl.create_default_context()
                        ) as response:
                            return response.status, response.read()
                    except urllib.error.HTTPError as error:
                        return error.code, error.read()
                    except urllib.error.URLError as error:
                        raise SystemExit(
                            f"Harbor API request failed; quarantine tag retained: {error}"
                        )

                def artifact(reference, scan_overview=False):
                    encoded_reference = urllib.parse.quote(reference, safe="")
                    query = "?with_scan_overview=true" if scan_overview else ""
                    code, body = request(
                        "GET", f"/artifacts/{encoded_reference}{query}"
                    )
                    if code != 200:
                        detail = body.decode(errors="replace")
                        raise SystemExit(
                            f"Harbor returned HTTP {code} resolving "
                            f"{image_repository}:{reference}; quarantine tag retained\n"
                            f"{detail}"
                        )
                    try:
                        return json.loads(body)
                    except json.JSONDecodeError as error:
                        raise SystemExit(
                            f"Harbor returned invalid artifact JSON; "
                            f"quarantine tag retained: {error}"
                        )

                def scan_summary(document):
                    overview = document.get("scan_overview") or {}
                    if not overview:
                        return None
                    preferred = [
                        value
                        for key, value in overview.items()
                        if "vulnerability.report" in key and "version=1.1" in key
                    ]
                    return (preferred or list(overview.values()))[0]

                first_artifact = artifact(quarantine_tag, scan_overview=True)
                digest = first_artifact.get("digest", "")
                if not (
                    digest.startswith("sha256:")
                    and len(digest) == 71
                    and all(c in "0123456789abcdef" for c in digest[7:])
                ):
                    raise SystemExit(
                        "Harbor returned an invalid digest; quarantine tag retained"
                    )

                summary = scan_summary(first_artifact)
                status = str((summary or {}).get("scan_status", "")).lower()
                if status not in {"success", "pending", "running", "queued"}:
                    encoded_tag = urllib.parse.quote(quarantine_tag, safe="")
                    code, body = request("POST", f"/artifacts/{encoded_tag}/scan")
                    if code != 202:
                        detail = body.decode(errors="replace")
                        raise SystemExit(
                            f"Harbor returned HTTP {code} starting the scan; "
                            f"quarantine tag retained\n{detail}"
                        )
                    print(f"Started Harbor scan for {image_repository}:{quarantine_tag}")

                completed_artifact = None
                completed_summary = None
                for attempt in range(1, wait_attempts + 1):
                    current = artifact(quarantine_tag, scan_overview=True)
                    current_summary = scan_summary(current)
                    current_status = str(
                        (current_summary or {}).get("scan_status", "Pending")
                    )
                    print(
                        f"Harbor scan status: {current_status} "
                        f"({attempt}/{wait_attempts})"
                    )
                    normalized_status = current_status.lower()
                    if normalized_status == "success":
                        completed_artifact = current
                        completed_summary = current_summary
                        break
                    if normalized_status in {
                        "error", "stopped", "unsupported", "failed"
                    }:
                        raise SystemExit(
                            f"Harbor scan ended with {current_status}; "
                            "quarantine tag retained"
                        )
                    if attempt < wait_attempts:
                        time.sleep(wait_seconds)

                if completed_summary is None:
                    raise SystemExit(
                        "Timed out waiting for Harbor scan; quarantine tag retained"
                    )
                if completed_artifact.get("digest") != digest:
                    raise SystemExit(
                        "Quarantine tag changed during scanning; tag retained"
                    )

                encoded_tag = urllib.parse.quote(quarantine_tag, safe="")
                code, report_body = request(
                    "GET",
                    f"/artifacts/{encoded_tag}/additions/vulnerabilities",
                    accept=vulnerability_accept,
                )
                if code != 200:
                    detail = report_body.decode(errors="replace")
                    raise SystemExit(
                        f"Harbor returned HTTP {code} retrieving the completed "
                        f"vulnerability report; quarantine tag retained\n{detail}"
                    )
                try:
                    vulnerability_report = json.loads(report_body)
                except json.JSONDecodeError as error:
                    raise SystemExit(
                        f"Harbor returned invalid vulnerability JSON; "
                        f"quarantine tag retained: {error}"
                    )

                pathlib.Path("scan-report/artifact.json").write_text(
                    json.dumps(completed_artifact, indent=2) + "\n"
                )
                pathlib.Path("scan-report/vulnerabilities.json").write_text(
                    json.dumps(vulnerability_report, indent=2) + "\n"
                )

                vulnerability_summary = completed_summary.get("summary") or {}
                counts = vulnerability_summary.get("summary") or {}
                try:
                    total_count = int(vulnerability_summary["total"])
                    normalized_counts = {
                        str(severity).lower(): int(count)
                        for severity, count in counts.items()
                    }
                except (KeyError, TypeError, ValueError):
                    raise SystemExit(
                        "Completed Harbor scan has invalid severity counts; "
                        "quarantine tag retained"
                    )
                if not normalized_counts and total_count != 0:
                    raise SystemExit(
                        "Completed Harbor scan omitted counts for reported "
                        "vulnerabilities; quarantine tag retained"
                    )

                print(f"Harbor scan digest: {digest}")
                print(
                    f"Harbor vulnerability total: {total_count}; counts: "
                    + (
                        ", ".join(
                            f"{name}={count}"
                            for name, count in sorted(normalized_counts.items())
                        )
                        or "none"
                    )
                )
                blocked_count = sum(
                    normalized_counts.get(severity, 0)
                    for severity in blocked_severities
                )

                def delete_quarantine_tag():
                    encoded_digest = urllib.parse.quote(digest, safe="")
                    encoded_quarantine = urllib.parse.quote(quarantine_tag, safe="")
                    code, body = request(
                        "DELETE",
                        f"/artifacts/{encoded_digest}/tags/{encoded_quarantine}",
                    )
                    if code not in {200, 404}:
                        detail = body.decode(errors="replace")
                        raise SystemExit(
                            f"Harbor returned HTTP {code} deleting quarantine tag\n"
                            f"{detail}"
                        )
                    print(f"Removed temporary tag {quarantine_tag}")

                if blocked_count:
                    print(json.dumps(vulnerability_report, indent=2))
                    delete_quarantine_tag()
                    raise SystemExit(
                        f"Rejected {image_repository}@{digest}: found "
                        f"{blocked_count} vulnerabilities in blocked severities "
                        f"{sorted(blocked_severities)}"
                    )

                encoded_digest = urllib.parse.quote(digest, safe="")
                code, body = request(
                    "POST",
                    f"/artifacts/{encoded_digest}/tags",
                    body={"name": candidate_tag},
                )
                if code == 409:
                    existing = artifact(candidate_tag)
                    if existing.get("digest") != digest:
                        raise SystemExit(
                            f"Immutable tag {candidate_tag} already points to "
                            "another digest; quarantine tag retained"
                        )
                    print(f"Tag {candidate_tag} already points to {digest}")
                elif code == 201:
                    print(f"Created immutable tag {candidate_tag} on {digest}")
                else:
                    detail = body.decode(errors="replace")
                    raise SystemExit(
                        f"Harbor returned HTTP {code} creating {candidate_tag}; "
                        f"quarantine tag retained\n{detail}"
                    )

                delete_quarantine_tag()
                verified = artifact(candidate_tag)
                if verified.get("digest") != digest:
                    raise SystemExit(
                        f"Post-promotion verification failed for {candidate_tag}"
                    )
                print(
                    f"Published verified candidate "
                    f"{image_repository}:{candidate_tag}@{digest}"
                )
