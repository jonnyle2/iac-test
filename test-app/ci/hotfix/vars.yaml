---
repo: https://github.com/jonnyle2/test-app
branch: hotfix
# List of files/folders that trigger a hotfix build.
git_paths:
  - home.html
  - Dockerfile
  - requirements.txt
  # - src/**
dockerfile_path: .

# Use the same Harbor repository as dev so production can promote either
# pipeline's immutable git-<SHA> tag.
hotfix_image: test-app

# Pin pipeline tooling to deliberate versions and update them through review.
oci_build_task_tag: "0.15"
harbor_api_scheme: https
harbor_api_task_repository: python
harbor_api_task_tag: "3.13-alpine"
harbor_scan_wait_attempts: "60"
harbor_scan_wait_seconds: "10"
harbor_blocked_severities: HIGH,CRITICAL
